stages:
  - publish_base
  - publish

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

.docker_publish_job:
  image: registry.hzdr.de/hzb/it-automation/ubuntu_22_04_docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

publish_base:
  extends: .docker_publish_job
  stage: publish_base
  script:
    - docker build --target all_deps -t "$CI_REGISTRY_IMAGE/all_deps:test" -f Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/all_deps:test"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$CI_REGISTRY_IMAGE/all_deps:test" "$CI_REGISTRY_IMAGE/all_deps:main"
        docker push "$CI_REGISTRY_IMAGE/all_deps:main"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/all_deps:test" "$CI_REGISTRY_IMAGE/all_deps:latest"
        docker tag "$CI_REGISTRY_IMAGE/all_deps:test" "$CI_REGISTRY_IMAGE/all_deps:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/all_deps:latest"
        docker push "$CI_REGISTRY_IMAGE/all_deps:$CI_COMMIT_TAG"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - pyproject.toml
        - uv.lock
        - Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_TAG'

publish:
  extends: .docker_publish_job
  stage: publish
  script:
    - docker pull "$CI_REGISTRY_IMAGE/all_deps:main" || docker pull "$CI_REGISTRY_IMAGE/all_deps:latest" || true
    - docker build --target se_hmi_spin -t "$CI_REGISTRY_IMAGE/se_hmi_spin:main" -f Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/se_hmi_spin:main"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/se_hmi_spin:main" "$CI_REGISTRY_IMAGE/se_hmi_spin:latest"
        docker tag "$CI_REGISTRY_IMAGE/se_hmi_spin:main" "$CI_REGISTRY_IMAGE/se_hmi_spin:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/se_hmi_spin:latest"
        docker push "$CI_REGISTRY_IMAGE/se_hmi_spin:$CI_COMMIT_TAG"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

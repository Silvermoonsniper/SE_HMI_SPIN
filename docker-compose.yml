services:
  postgres:
    image: postgres:16-alpine
    container_name: se_hmi_spin_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  se_hmi_spin:
    build: .
    container_name: se_hmi_spin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000"
      - "8001:8001"
    volumes:
      # Mount the whole configuration directory so files created/edited on the host
      # (e.g., configuration/plots.css, configuration/plots.js, layout/) are visible
      # inside the container and served under /c/* by Spin.
      - ./configuration:/app/configuration
      # Mount content directory for live updates during development
      - ./content:/app/content
      # Persist server-side layout JSON files created at runtime
      - ./layout:/app/layout
      # Persist server-side plot configuration JSON files created at runtime
      - ./plot_config:/app/plot_config
      # Persist CSV data exports written by the backend data saver
      - ./data_exports:/app/data_exports
      # Mount PostgreSQL data read-only so the backend can monitor the same storage path
      - ./postgres_data:/app/postgres_data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - STORAGE_ALERT_WARN_PERCENT=${STORAGE_ALERT_WARN_PERCENT:-85}
      - STORAGE_ALERT_CRITICAL_PERCENT=${STORAGE_ALERT_CRITICAL_PERCENT:-95}

    restart: unless-stopped




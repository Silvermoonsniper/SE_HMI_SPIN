version: '3.8'

services:
  se_hmi_spin:
    build: .
    container_name: se_hmi_spin
    ports:
      - "8080:8000"
      - "8001:8001"
    volumes:
      # Mount the whole configuration directory so files created/edited on the host
      # (e.g., configuration/plots.css, configuration/plots.js, layout/) are visible
      # inside the container and served under /c/* by Spin.
      - ./configuration:/app/configuration
      # Mount content directory for live updates during development
      - ./content:/app/content
    environment:
      - PYTHONUNBUFFERED=1
    # Add host.docker.internal mapping for Linux compatibility
    # On macOS/Windows this is automatic, but Linux needs it explicitly
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - se_hmi_network

networks:
  se_hmi_network:
    driver: bridge
